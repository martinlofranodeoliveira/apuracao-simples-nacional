[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apuracao-simples-nacional"
version = "1.0.0"
description = "Apuração determinística do Simples Nacional (LC 123/2006), Anexos I a V, Fator R, Alíquota Efetiva e partição de tributos. Zero dependências, Python 3.11+, MIT — LOFRANO TECNOLOGIA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LOFRANO TECNOLOGIA" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
simples-nacional = "apuracao_simples_nacional.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
