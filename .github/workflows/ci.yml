name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Executar Testes Unitários
      shell: bash
      run: |
        PYTHONPATH=src python -m unittest discover -s tests -v

    - name: Executar Verificador Independente SQLite
      shell: bash
      run: |
        python tools/verify_independent.py exemplares/empresa_mista_comercio_servicos.json

  packaging:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Instalar ferramentas de build
      run: |
        python -m pip install --upgrade pip build wheel

    - name: Construir Wheel e sdist
      run: |
        python -m build

    - name: Verificar Integridade do Pacote
      run: |
        python scripts/check_distribution.py

    - name: Testar Execução Isolada de Rede (unshare)
      run: |
        unshare -n python -m unittest discover -s tests -v
